services:
  quizmate:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./raw:/app/raw
      - ./logs:/app/logs
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - quizmate
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
